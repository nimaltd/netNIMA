[workspace]
members = ["crates/netnima-core", "crates/netnima-helper", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Nima Askari (NimaLTD) <nima.askari@gmail.com>"]
repository = "https://github.com/nimaltd/netNIMA"
homepage = "https://github.com/nimaltd/netNIMA"

[profile.release]
codegen-units = 1
lto = true
strip = true
