name: Release

# A tag such as v1.0.0 builds the installers for every OS and leaves them on a
# draft GitHub Release, to be published by hand once all three are there. It
# can also be started by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: ""
            args: ""
          - name: macOS
            os: macos-latest
            # One app for Apple Silicon and Intel.
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on older systems too.
            os: ubuntu-22.04
            targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # The release config builds netnima-helper first and puts it beside the app.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: netNIMA v__VERSION__
          releaseBody: |
            A network tester for embedded developers: UDP, TCP, TLS and DTLS, and the protocols on top of them, each as a client and as a server.

            **Downloads**
            - Windows 10 and 11: the `-setup.exe` installer, or the `.msi`
            - macOS, Apple Silicon and Intel: the `.dmg`
            - Linux: the `.AppImage`, `.deb` or `.rpm`

            **The apps are not signed yet**
            - Windows may say "Windows protected your PC": click More info, then Run anyway.
            - macOS may say the app is damaged or cannot be checked: move it to Applications, then run `xattr -cr /Applications/netNIMA.app` in Terminal.
            - Linux: `chmod +x` the AppImage.

            What changed: [CHANGELOG.md](https://github.com/nimaltd/netNIMA/blob/main/CHANGELOG.md).
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

      # The installers tried as a person would, on a machine that is thrown away
      # afterwards: the app and its helper are both there, and the helper runs.
      # The release is a draft until someone publishes it, so a failure here is seen first.
      - name: Try the setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $folder = "$env:LOCALAPPDATA\netNIMA"
          if (-not (Test-Path "$folder\netNIMA.exe")) { throw 'the app is not there' }
          & "$folder\netnima-helper.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'the helper did not run' }
          Start-Process "$folder\uninstall.exe" -ArgumentList '/S' -Wait

      - name: Try the package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          which netnima netnima-helper
          netnima-helper --version
          sudo apt-get remove -y netnima

      - name: Try the app
        if: runner.os == 'macOS'
        run: |
          # What fails is said as an annotation too, which anyone can read without the log.
          must() {
            if ! output=$("$@" 2>&1); then
              echo "::error::$*: $(tail -1 <<< "$output")"
              exit 1
            fi
            echo "$output"
          }
          image=$(find target/universal-apple-darwin/release/bundle/dmg -name 'netNIMA_*.dmg' | head -1)
          place="$RUNNER_TEMP/netNIMA-try"
          mkdir "$place"
          # The image asks a person to agree to its licence before it opens, and a plain copy of it does not.
          must hdiutil convert "$image" -quiet -format UDTO -o "$place.cdr"
          must hdiutil attach "$place.cdr" -nobrowse -readonly -mountpoint "$place"
          must "$place/netNIMA.app/Contents/MacOS/netnima-helper" --version
          must test -x "$place/netNIMA.app/Contents/MacOS/netNIMA"
          hdiutil detach "$place" -force || true
