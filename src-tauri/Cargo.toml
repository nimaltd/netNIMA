[package]
name = "netnima"
description = "A network tester for embedded developers: UDP, TCP, TLS and DTLS, and the protocols on top of them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netnima-core = { path = "../crates/netnima-core" }
serde = { version = "1", features = ["derive"] }
# A protocol tab's settings, passed on to netnima-core as the UI sent them.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
